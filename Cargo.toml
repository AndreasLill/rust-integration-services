[package]
name = "rust-integration-services"
version = "0.5.27"
edition = "2024"
authors = ["Andreas Lill"]
description = "A modern, fast, and lightweight integration library written in Rust, designed for memory safety and stability."
license = "MIT OR Apache-2.0"
repository = "https://github.com/AndreasLill/rust-integration-services"
readme = "README.md"
keywords = ["integration"]

[lib]
path = "src/lib.rs"

[dependencies]
bytes = "1.12.1"
futures = "0.3.34"
tracing = "0.1.44"
anyhow = "1.0.104"

tokio = { version = "1.53.2", optional = true, features = ["full"] }
tokio-util = { version = "0.7.19", optional = true, features = ["io"] }
hyper = { version = "1.12.0", optional = true, features = ["full"] }
hyper-util = { version = "0.1.21", optional = true, features = ["full"] }
hyper-rustls = { version = "0.27.10", optional = true }
http-body = { version = "1.1.0", optional = true }
http-body-util = { version = "0.1.5", optional = true }
matchit = { version = "0.9.2", optional = true }
rustls = { version = "0.23.45", optional = true, features = ["ring"] }
rustls-native-certs = { version = "0.8.4", optional = true }
tokio-rustls = { version = "0.26.6", optional = true } 
webpki-roots = { version = "1.0.9", optional = true }
rustls-pki-types = { version = "1.15.1", optional = true }
regex = { version = "1.13.1", optional = true }
time = { version = "0.3.55", optional = true }
russh = { version = "0.64.1", optional = true, default-features = false, features = [ "ring", "rsa" ] }
russh-sftp =  { version = "3.0.1", optional = true }
lettre = { version = "0.11.23", optional = true, default-features = false, features = ["builder", "smtp-transport", "pool", "hostname", "tokio1-rustls-tls"] }
aws-sdk-s3 = { version = "1.152.0", optional = true, default-features = false, features = ["rustls", "rt-tokio"] }
aws-config = { version = "1.12.0", optional = true, default-features = false, features = ["rustls", "rt-tokio"] }

[dev-dependencies]
tokio-test = "0.4.6"
tracing-subscriber = "0.3.23"

[features]
default = []
full = ["file", "scheduler", "sftp", "http", "smtp", "s3"]
http = ["tokio", "hyper", "hyper-util", "hyper-rustls", "http-body-util", "tokio-rustls", "webpki-roots", "rustls", "rustls-pki-types", "rustls-native-certs", "matchit"]
file = ["tokio", "tokio-util"]
scheduler = ["tokio", "time"]
sftp = ["tokio", "tokio-util", "russh", "russh-sftp", "regex"]
smtp = ["tokio", "lettre"]
s3 = ["tokio", "tokio-util", "aws-sdk-s3", "aws-config", "regex", "http-body", "http-body-util"]